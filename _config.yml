# ================================
# BASIC SETTINGS
# ================================
locale: "en-US"
lang: "en"
title: "Claudio Téllez"
title_separator: "-"
name: "Claudio Téllez"
description: "Claudio Téllez's academic portfolio"

url: "https://claudio-tellez.github.io"
baseurl: ""
base_path: "https://claudio-tellez.github.io"

repository: "claudio-tellez/claudio-tellez.github.io"
timezone: America/Sao_Paulo

site_theme: "mint"

# ================================
# AUTHOR
# ================================
author:
  avatar: "https://claudio-tellez.github.io/images/profile.png"
  name: "Claudio Téllez"
  bio: "PhD in International Relations, Mathematician"
  location: "Teresópolis/RJ - Brazil"
  uri: "https://claudio-tellez.github.io"
  email: "tellez.ca@gmail.com"
  orcid: "https://orcid.org/0000-0001-6215-7781"
  facebook: "claudiotellez"
  instagram: "claudio.tellez"
  linkedin: "tellezzepeda"
  youtube: "claudio_tellez"

# ================================
# SOCIAL / SEO
# ================================
social:
  type: Person
  name: "Claudio Téllez"
  links:
    - "https://claudio-tellez.github.io"
    - "https://orcid.org/0000-0001-6215-7781"
    - "https://linkedin.com/in/tellezzepeda"

og_image: "/images/profile.png"
og_description: "International Relations theorist working on institutions, political theory, and global order."

# ================================
# SITE SETTINGS
# ================================
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

# ================================
# COMMENTS / ANALYTICS
# ================================
comments:
  provider: false

analytics:
  provider: false

# ================================
# FILE HANDLING
# ================================
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ================================
# MARKDOWN
# ================================
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6

# ================================
# COLLECTIONS
# ================================
collections:
  publications:
    output: true
    permalink: /publications/:path/
  talks:
    output: true
    permalink: /talks/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/
  working_papers:
    output: true
    permalink: /working-papers/:path/

# ================================
# DEFAULTS
# ================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true

  - scope:
      path: ""
      type: working_papers
    values:
      layout: single
      author_profile: true

# ================================
# URL STRUCTURE
# ================================
permalink: /:title/

# ================================
# PLUGINS
# ================================
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ================================
# ARCHIVES
# ================================
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# ================================
# HTML COMPRESSION
# ================================
compress_html:
  clippings: all
  ignore:
    envs: development
